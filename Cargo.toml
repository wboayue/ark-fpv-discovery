[package]
name = "ark-fpv-discovery"
version = "0.2.0"
authors = ["Wil Boayue <wil@wsblabs.com>"]
license = "MIT"
description = "Bare-metal Rust (RTIC) firmware for the ARK FPV (STM32H743) flight controller — IMU/baro/mag bring-up and sensor fusion (attitude & altitude). Sensing and estimation, not a full flight stack."
repository = "https://github.com/wboayue/ark-fpv-discovery"
readme = "README.md"
keywords = ["embedded", "rtic", "stm32", "flight-controller", "sensor-fusion"]
categories = ["embedded", "no-std", "aerospace::drones", "hardware-support"]
# Board-specific firmware binary, not a library — not meant for crates.io.
publish = false
# edition 2024 to match the fusion-ahrs / fusion-altitude crates (both edition 2024, rustc >= 1.85).
edition = "2024"

# Workspace: the firmware crate (this root package) plus host-side tools that must NEVER be part
# of the firmware build. `default-members = ["."]` makes a bare `cargo build` / `cargo objcopy`
# (and the whole flash/release flow) touch ONLY the firmware — the embedded target in
# `.cargo/config.toml` never tries to compile a std host tool. Build a tool explicitly, for the
# host triple, e.g. `cargo run -p telem --target $(rustc -vV | sed -n 's/^host: //p')` (or `just telem`).
# Do NOT `cargo build --workspace` here — that would try to build the host tools for thumbv7em.
[workspace]
members = ["tools/telem"]
default-members = ["."]
resolver = "3"

[dependencies]
cortex-m = "0.7"
cortex-m-rt = "0.7"
panic-halt = "0.2"

rtic = { version = "2.2", features = ["thumbv7-backend"] }
rtic-monotonics = { version = "2.0", features = ["cortex-m-systick"] }

stm32h7xx-hal = { version = "0.16", features = [
  "stm32h743v",
  "rt",
  "usb_hs"
] }

usb-device = "0.3"
usbd-serial = "0.2"
heapless = "0.8"

# Shared firmware<->host telemetry wire format (postcard + COBS frames). We only call its
# codec::encode (which wraps postcard), so no direct postcard/serde dep is needed here.
discovery-telemetry = "0.2.0"

# Sensor fusion. fusion-ahrs needs nalgebra (no_std via libm); declare nalgebra directly, pinned to
# the same version/features so Cargo unifies to one copy. libm provides powf for the baro→altitude
# formula (powf is std-only). See CLAUDE.md "Sensors — Fusion".
fusion-ahrs = "0.6"
fusion-altitude = "0.1"
nalgebra = { version = "0.34", default-features = false, features = ["libm"] }
libm = "0.2"
